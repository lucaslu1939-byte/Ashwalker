<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sunbeam Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Lexend:wght@400;600;700&family=DM+Mono:wght@500&display=swap">
<style>
/* Layout: a shadow-puppet stage lit by a sunbeam from the top-left. Header strip, hero with a live mini shadow theatre + rank card, then a grid of six lab stations; each station opens as its own view. */
:root{
  --bg:#F3F2F8; --glow:#FFE8A8; --card:#FFFFFF; --ink:#1E1B3A; --muted:#5C5878; --line:#DCD9EA;
  --sun:#FFB000; --sun-soft:#FFE29A; --accent:#5B3FD6; --star:#F2A900; --star-edge:#8A6200;
  --room:#2B2748; --beam:#FFF1B8; --screen:#FFF7DC; --shade:#1E1B3A;
  --sky:#DCEBFF; --ground:#CFE4B4; --cast:#1E1B3A;
  --transparent:#1E9FB0; --translucent:#8A6DE8; --opaque:#8B5E3C;
  --metal:#61739A; --wood:#B07A35; --hot:#E5484D; --cold:#2F7FE0;
  --good:#157A45; --good-bg:#E3F5EA; --bad:#CC3F37; --bad-bg:#FCE8E6;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Lexend",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#110F22; --glow:#2E2712; --card:#1B1833; --ink:#ECEAF7; --muted:#A6A2C4; --line:#312D52;
    --sun:#FFC233; --sun-soft:#5A4610; --accent:#A996FF; --star:#FFC933; --star-edge:#FFC933;
    --room:#0A0916; --beam:#6B5A1E; --screen:#F3E7BC; --shade:#000000;
    --sky:#1C2347; --ground:#2F5A3A; --cast:#000000;
    --transparent:#4CC9D8; --translucent:#B19DFF; --opaque:#C48A5E;
    --metal:#9AACD3; --wood:#D9A15A; --hot:#FF6B6F; --cold:#5EA3F5;
    --good:#4CCB86; --good-bg:#12301F; --bad:#FF7A70; --bad-bg:#3A1716;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#110F22; --glow:#2E2712; --card:#1B1833; --ink:#ECEAF7; --muted:#A6A2C4; --line:#312D52;
  --sun:#FFC233; --sun-soft:#5A4610; --accent:#A996FF; --star:#FFC933; --star-edge:#FFC933;
  --room:#0A0916; --beam:#6B5A1E; --screen:#F3E7BC; --shade:#000000;
  --sky:#1C2347; --ground:#2F5A3A; --cast:#000000;
  --transparent:#4CC9D8; --translucent:#B19DFF; --opaque:#C48A5E;
  --metal:#9AACD3; --wood:#D9A15A; --hot:#FF6B6F; --cold:#5EA3F5;
  --good:#4CCB86; --good-bg:#12301F; --bad:#FF7A70; --bad-bg:#3A1716;
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0; color:var(--ink); background-color:var(--bg);
  background-image:radial-gradient(900px 520px at 0% -8%,var(--glow),transparent 70%);
  background-repeat:no-repeat;
  font:16.5px/1.6 var(--body);
}
.app{max-width:1060px; margin:0 auto; padding-inline:16px; padding-block:18px 56px}
h1,h2,h3{font-family:var(--display); font-weight:800; line-height:1.08; text-wrap:balance; margin:0}
p{margin:0}
button,input{font:inherit; color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
[tabindex="-1"]:focus{outline:none}
.mono{font-family:var(--mono); font-variant-numeric:tabular-nums}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.eyebrow{font-size:.76rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.beam{background:linear-gradient(transparent 52%,var(--sun-soft) 52%,var(--sun-soft) 90%,transparent 90%); padding-inline:.06em}

/* Range sliders: big thumbs for small fingers */
input[type=range]{-webkit-appearance:none; appearance:none; height:40px; background:transparent; cursor:pointer; width:100%}
input[type=range]::-webkit-slider-runnable-track{height:8px; border-radius:999px; background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:28px; height:28px; margin-top:-10px; border-radius:50%; background:var(--accent); border:3px solid var(--card); box-shadow:0 1px 4px rgba(0,0,0,.35)}
input[type=range]::-moz-range-track{height:8px; border-radius:999px; background:var(--line)}
input[type=range]::-moz-range-thumb{width:24px; height:24px; border-radius:50%; background:var(--accent); border:3px solid var(--card)}
input[type=range]:disabled{opacity:.5; cursor:default}

/* Header */
.top{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px 20px; margin-bottom:26px}
.brand{display:flex; align-items:center; gap:12px; background:none; border:0; padding:0; cursor:pointer; text-align:left}
.brand svg{width:44px; height:44px; flex:none}
.brand-name{font-family:var(--display); font-weight:800; font-size:1.85rem; line-height:1}
.brand-sub{display:block; font-size:.8rem; color:var(--muted); margin-top:4px}
.stats{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.pill{display:inline-flex; align-items:center; gap:6px; padding:6px 13px; border-radius:999px; background:var(--card); border:1.5px solid var(--line); font-size:.88rem; font-weight:600}
.pill .star{width:16px; height:16px}
.icon-btn{cursor:pointer}

/* Buttons */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:46px; padding:10px 20px; border-radius:999px; border:2px solid var(--ink); background:var(--ink); color:var(--bg); font-weight:700; cursor:pointer; transition:transform .12s ease}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
.btn.sun{background:var(--sun); border-color:var(--sun); color:#2A1E00}
.btn.ghost{background:transparent; color:var(--ink)}
.btn:disabled{opacity:.45; cursor:not-allowed; transform:none}
.back{background:none; border:0; padding:6px 0; color:var(--muted); font-weight:600; cursor:pointer}
.back:hover{color:var(--ink)}

.stars{display:inline-flex; gap:2px}
.star{width:22px; height:22px; fill:var(--line); stroke:var(--muted); stroke-width:1; stroke-opacity:.5}
.star.on{fill:var(--star); stroke:var(--star-edge); stroke-opacity:1}

/* Home */
.hero{display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,1fr); gap:22px; align-items:stretch; margin-bottom:30px}
.hero-main{display:flex; flex-direction:column; gap:14px; min-width:0}
.hero h1{font-size:clamp(2.1rem,5.4vw,3.4rem)}
.lede{max-width:54ch; color:var(--muted); font-size:1.05rem}
.lede b{color:var(--ink)}
.stage{background:var(--room); border-radius:var(--r); padding:14px; display:flex; flex-direction:column; gap:6px; min-width:0}
.stage svg{width:100%; height:auto; display:block}
.stage label{color:#F3F0FF; font-size:.88rem; font-weight:600; display:flex; align-items:center; gap:12px}
.stage input{flex:1; min-width:0}
.stage input::-webkit-slider-thumb{background:var(--sun); border-color:var(--room)}
.stage input::-moz-range-thumb{background:var(--sun); border-color:var(--room)}
.stage input::-webkit-slider-runnable-track{background:#4A456E}
.stage input::-moz-range-track{background:#4A456E}
.stage input:focus-visible{outline-color:var(--sun)}
.side{display:flex; flex-direction:column; gap:16px; min-width:0}
.rank{background:var(--card); border:1.5px solid var(--line); border-radius:var(--r); padding:18px 20px}
.rank-name{font-family:var(--display); font-size:1.65rem; font-weight:800; margin-block:2px 10px}
.meter{height:14px; border-radius:999px; background:var(--bg); border:1.5px solid var(--line); overflow:hidden}
.meter i{display:block; height:100%; background:var(--sun); border-radius:999px; box-shadow:inset 0 0 0 1.5px var(--star-edge); transition:width .5s ease}
.rank-foot{display:flex; justify-content:space-between; flex-wrap:wrap; gap:4px 10px; margin-top:8px; font-size:.86rem; color:var(--muted)}
.strands{display:flex; gap:10px; flex-wrap:wrap}
.strand{flex:1 1 140px; padding:12px 14px; border-radius:12px; border:1.5px dashed var(--line); font-size:.88rem; color:var(--muted)}
.strand b{display:block; font-family:var(--display); font-size:1.15rem; color:var(--ink)}
.section-label{margin-block:30px 12px}
.stations{display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr)); gap:16px}
.st{display:flex; flex-direction:column; gap:8px; background:var(--card); border:1.5px solid var(--line); border-radius:var(--r); padding:18px 18px 18px 22px; position:relative; overflow:hidden}
.st::before{content:""; position:absolute; inset:0 auto 0 0; width:7px; background:var(--tone)}
.st-top{display:flex; justify-content:space-between; align-items:center; gap:8px}
.st-num{font-family:var(--mono); font-size:.78rem; color:var(--muted); font-weight:500}
.st h3{font-size:1.45rem}
.st p{color:var(--muted); font-size:.94rem; flex:1}
.st .btn{align-self:flex-start; margin-top:4px}
.st.notes{background:transparent; border:2px dashed var(--line)}
.st.notes::before{display:none}

/* Station views */
.station-head{display:flex; flex-direction:column; gap:6px; margin-bottom:18px}
.station-head h2{font-size:clamp(2rem,4.8vw,2.7rem)}
.intro{color:var(--muted); max-width:62ch}
.rules{display:flex; align-items:center; flex-wrap:wrap; gap:6px; font-size:.86rem; color:var(--muted)}
.rules .star{width:16px; height:16px}
.progress{display:flex; align-items:center; gap:12px; margin-bottom:14px}
.progress .bar{flex:1; height:10px; border-radius:999px; background:var(--card); border:1.5px solid var(--line); overflow:hidden}
.progress .bar i{display:block; height:100%; width:0; background:var(--sun); box-shadow:inset 0 0 0 1.5px var(--star-edge); transition:width .3s ease}
.qbox{background:var(--card); border:1.5px solid var(--line); border-radius:var(--r); padding:22px; box-shadow:0 10px 30px -18px var(--shade)}
.prompt{font-size:1.12rem; font-weight:600; margin-bottom:16px; max-width:64ch}
.opts{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr)); gap:10px}
.opt{display:flex; align-items:center; gap:12px; text-align:left; padding:12px 14px; min-height:54px; border-radius:12px; border:2px solid var(--line); background:var(--bg); cursor:pointer; transition:border-color .12s, transform .12s}
.opt:hover:not(:disabled){border-color:var(--ink); transform:translateY(-1px)}
.opt:disabled{cursor:default}
.opt-key{flex:none; width:30px; height:30px; display:grid; place-items:center; border-radius:50%; background:var(--card); border:1.5px solid var(--line); font-family:var(--mono); font-size:.85rem}
.opt.correct{border-color:var(--good); background:var(--good-bg)}
.opt.wrong{border-color:var(--bad); background:var(--bad-bg)}
.opt.correct::after{content:"✓"; margin-left:auto; font-weight:800; font-size:1.2rem; color:var(--good)}
.opt.wrong::after{content:"✗"; margin-left:auto; font-weight:800; font-size:1.2rem; color:var(--bad)}
.opt.big{justify-content:center; text-align:center; font-family:var(--display); font-size:1.25rem; font-weight:700; min-height:72px}
.opt.big.correct::after,.opt.big.wrong::after{margin-left:10px}
.fig{margin:0 0 16px; display:flex; flex-wrap:wrap; gap:18px; align-items:flex-end}
.fig svg{max-width:100%; height:auto}
.fb{margin-top:16px; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:6px 18px; align-items:center; padding:16px 18px; border-radius:var(--r); border:2px solid; animation:pop .25s ease}
.fb.good{border-color:var(--good); background:var(--good-bg)}
.fb.bad{border-color:var(--bad); background:var(--bad-bg)}
.fb.info{border-color:var(--line); background:var(--card)}
.fb-mark{font-family:var(--display); font-weight:800; font-size:1.3rem}
.fb.good .fb-mark{color:var(--good)} .fb.bad .fb-mark{color:var(--bad)}
.fb-body{grid-column:1; min-width:0}
.fb .btn{grid-column:2; grid-row:1 / span 2}
@media (max-width:560px){ .fb{grid-template-columns:minmax(0,1fr)} .fb .btn{grid-column:1; grid-row:auto; justify-self:start} }
@keyframes pop{from{transform:scale(.97); opacity:.4}to{transform:none; opacity:1}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.shake{animation:shake .35s ease}

/* Specimen card (station 1) */
.specimen{display:flex; flex-direction:column; align-items:center; gap:4px; padding:18px; margin-bottom:16px; border-radius:12px; background:var(--bg); border:2px dashed var(--line)}
.spec-icon{font-size:4rem; line-height:1.15}
.spec-icon svg{width:1em; height:1em; display:block}
.spec-name{font-family:var(--display); font-size:1.7rem; font-weight:800; text-align:center}
.spec-note{font-size:.9rem; color:var(--muted); text-align:center}

/* Sorting boards */
.howto{margin-bottom:12px; font-weight:600}
.bins{display:grid; grid-template-columns:repeat(var(--cols,3),minmax(0,1fr)); gap:12px; margin-bottom:16px}
.bin{display:flex; flex-direction:column; gap:4px; text-align:left; padding:14px; min-height:160px; border-radius:var(--r); border:2.5px solid var(--c); background:var(--card); cursor:pointer; transition:transform .12s}
.bin:hover{transform:translateY(-2px)}
.bin.armed{box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 28%,transparent)}
.bin-name{font-family:var(--display); font-size:1.35rem; font-weight:800; color:color-mix(in srgb,var(--c) 70%,var(--ink))}
.bin-hint{font-size:.85rem; color:var(--muted)}
.bin-items{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px}
.placed{font-size:.8rem; padding:3px 9px; border-radius:999px; background:color-mix(in srgb,var(--c) 14%,var(--card)); border:1px solid var(--c)}
.tray{display:flex; flex-wrap:wrap; gap:10px; min-height:60px; padding:14px; border-radius:var(--r); border:2px dashed var(--line); background:var(--card)}
.chip{display:inline-flex; align-items:center; gap:8px; padding:9px 15px; min-height:44px; border-radius:999px; border:2px solid var(--line); background:var(--bg); font-weight:600; cursor:pointer}
.chip span{font-size:1.3rem; line-height:1}
.chip.sel{border-color:var(--accent); background:var(--card); box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 28%,transparent)}
@media (max-width:640px){
  .bins{grid-template-columns:minmax(0,1fr)} .bin{min-height:0}
  .sfb{position:sticky; bottom:8px; z-index:2; max-height:40vh; overflow:auto; box-shadow:0 8px 24px -10px var(--shade)}
}

/* Lab blocks, canvases, controls */
.lab-block{background:var(--card); border:1.5px solid var(--line); border-radius:var(--r); padding:18px; margin-bottom:18px}
.lab-block h3{font-size:1.4rem; margin-bottom:4px}
.lab-block > p{color:var(--muted); margin-bottom:12px}
canvas{display:block; width:100%; height:auto; border-radius:12px; border:1.5px solid var(--line)}
.legend{font-size:.85rem; color:var(--muted); margin-top:6px}
.controls{display:flex; flex-wrap:wrap; gap:12px 18px; align-items:center; margin-top:12px}
.ctrl{display:flex; flex-direction:column; gap:2px; flex:1 1 240px; min-width:0}
.ctrl label{font-weight:600; font-size:.92rem}
.seg{display:flex; flex-wrap:wrap; gap:8px}
.seg button{padding:8px 14px; min-height:44px; border-radius:999px; border:2px solid var(--line); background:var(--bg); font-weight:600; font-size:.92rem; cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--c,var(--ink)); background:color-mix(in srgb,var(--c,var(--ink)) 16%,var(--card))}
.seg button:disabled{cursor:default; opacity:.6}
.caption{margin-top:12px; padding:10px 14px; border-radius:10px; background:var(--bg); border-left:5px solid var(--c,var(--line))}
.tip{font-size:.9rem; color:var(--muted); margin-top:10px}
.tip.warn{color:var(--bad); font-weight:600}
.readout{font-weight:600; margin-top:8px}

/* Heat flow cards */
.flow{display:grid; grid-template-columns:minmax(0,1fr) 90px minmax(0,1fr); gap:10px; align-items:center; margin-bottom:16px}
.obj{display:flex; flex-direction:column; align-items:center; gap:6px; padding:14px 10px; border-radius:14px; background:var(--bg); border:1.5px solid var(--line); text-align:center}
.obj-icon{font-size:2.6rem; line-height:1.1}
.obj-name{font-weight:600; font-size:.95rem}
.obj-t{font-size:1.5rem}
.mini{width:18px; height:90px; border-radius:9px; border:2px solid var(--ink); background:var(--card); position:relative; overflow:hidden}
.mini i{position:absolute; left:0; right:0; bottom:0; border-radius:0 0 7px 7px}
.flow-mid{display:grid; place-items:center}
.flow-mid svg{width:80px; height:40px; overflow:visible}
.arrow-path{fill:none; stroke:var(--hot); stroke-width:5; stroke-linecap:round; stroke-linejoin:round}
.flow-mid svg.rev{transform:scaleX(-1)}
@media (max-width:480px){ .flow{grid-template-columns:minmax(0,1fr) 54px minmax(0,1fr)} .flow-mid svg{width:50px} .obj-t{font-size:1.2rem} }

/* Numeric answers */
.numform{display:flex; flex-wrap:wrap; gap:10px; align-items:center}
.numform input{width:140px; min-height:48px; padding:8px 12px; font:500 1.2rem var(--mono); border-radius:10px; border:2px solid var(--line); background:var(--bg); color:var(--ink)}
.numform.correct input{border-color:var(--good); background:var(--good-bg)}
.numform.wrong input{border-color:var(--bad); background:var(--bad-bg)}
.unit{font-weight:700; color:var(--muted)}
.thermo{width:150px}

/* SVG diagram classes */
.d-line{fill:none; stroke:var(--ink); stroke-width:2.2; stroke-linejoin:round; stroke-linecap:round}
.d-ray{fill:none; stroke:var(--sun); stroke-width:1.5; stroke-dasharray:4 4}
.d-thin{fill:none; stroke:var(--muted); stroke-width:1.2}
.d-ink{fill:var(--ink)}
.d-sun{fill:var(--sun)}
.d-beam{fill:var(--sun); fill-opacity:.22}
.d-shadow{fill:var(--ink); fill-opacity:.55}
.d-hot{fill:var(--hot)}
.d-lab{fill:var(--muted); font:500 12px var(--body)}
.d-ground{fill:var(--ground)}
.tick{stroke:var(--ink); stroke-width:1}
.tick.major{stroke-width:1.6}
.tlab{fill:var(--ink); font:500 10px var(--mono); text-anchor:end}
.dtable{border-collapse:collapse; min-width:280px}
.dtable th,.dtable td{padding:8px 14px; border:1.5px solid var(--line); text-align:center}
.dtable th{font-size:.85rem; color:var(--muted)}

/* Results */
.results{text-align:center; background:var(--card); border:1.5px solid var(--line); border-radius:var(--r); padding:30px 20px}
.results .stars .star{width:58px; height:58px}
.results h2{font-size:2.1rem; margin-block:12px 4px}
.results .score{font-family:var(--mono); font-size:1.1rem}
.results .msg{color:var(--muted); margin:8px auto 20px; max-width:46ch}
.row{display:flex; flex-wrap:wrap; gap:10px; justify-content:center}

/* Notebook */
.notes-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,430px),1fr)); gap:16px}
.note{background:var(--card); border:1.5px solid var(--line); border-radius:var(--r); padding:20px; min-width:0}
.note h3{font-size:1.4rem; margin-bottom:10px}
.note li{max-width:65ch}
.note ul{margin:8px 0 0; padding-left:20px; display:grid; gap:6px}
.def{padding:12px 14px; border-radius:10px; background:var(--bg); border-left:5px solid var(--sun); margin-bottom:10px}
.wrap-x{overflow-x:auto}
.ntable{border-collapse:collapse; width:100%; min-width:380px; font-size:.93rem}
.ntable th,.ntable td{padding:8px 10px; border-bottom:1.5px solid var(--line); text-align:left; vertical-align:top}
.ntable thead th{font-size:.76rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted)}
.ntable tbody th{font-family:var(--display); font-weight:800; font-size:1.05rem; border-left:5px solid var(--c)}

@media (max-width:820px){ .hero{grid-template-columns:minmax(0,1fr)} }
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation:none!important; transition:none!important} }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="brand" data-go="home" aria-label="Sunbeam Lab home">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <circle cx="17" cy="17" r="8" fill="var(--sun)"/>
        <g stroke="var(--sun)" stroke-width="3" stroke-linecap="round"><path d="M17 3v3M17 28v3M3 17h3M28 17h3M7 7l2 2M25 25l2 2M7 27l2-2M25 9l2-2"/></g>
        <path d="M24 44 L30 30 L44 30 L44 44 Z" fill="var(--ink)" opacity=".85"/>
        <rect x="33" y="16" width="5" height="14" rx="1" fill="var(--ink)"/>
      </svg>
      <span><span class="brand-name">Sunbeam Lab</span><span class="brand-sub">Primary 4 Science · Light, Shadows and Heat</span></span>
    </button>

const rand = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));
const randEven = (lo, hi) => 2 * rand(Math.ceil(lo / 2), Math.floor(hi / 2));

/* ---------- Sound ---------- */
let actx;
function sfx(kind) {
  if (!state.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const notes = kind === 'good' ? [587, 880] : kind === 'bad' ? [247, 208] : [440, 554, 659, 880];
    notes.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = kind === 'bad' ? 'square' : 'sine';
      o.frequency.value = f;
      const t = actx.currentTime + i * 0.1, peak = kind === 'bad' ? 0.045 : 0.14;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(peak, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
      o.connect(g).connect(actx.destination);
      o.start(t); o.stop(t + 0.24);
    });
  } catch (e) {}
}

/* ---------- Stars, ranks, header ---------- */
const STAR = on => `<svg viewBox="0 0 24 24" class="star${on ? ' on' : ''}" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6L2.5 9.4l6.6-.8z"/></svg>`;
const starRow = n => `<span class="stars" role="img" aria-label="${n} of 3 stars">${[0, 1, 2].map(k => STAR(k < n)).join('')}</span>`;
const MAX_STARS = 18;
const RANKS = [[0, 'Spark'], [5, 'Torch Bearer'], [10, 'Shadow Scientist'], [15, 'Heat Expert'], [18, 'Sunbeam Master']];
const totalStars = () => Object.values(state.best).reduce((a, b) => a + b, 0);
const starsFor = (right, n) => { const miss = n - right; return miss <= 1 ? 3 : miss <= 3 ? 2 : right >= Math.min(n / 2, n - 4) ? 1 : 0; };
const RULES = `<p class="rules">${STAR(true)}${STAR(true)}${STAR(true)} 0–1 mistakes · ${STAR(true)}${STAR(true)} 2–3 mistakes. Only your first try at each question counts.</p>`;
function rankInfo() {
  const s = totalStars();
  let i = 0; RANKS.forEach((r, k) => { if (s >= r[0]) i = k; });
  return { stars: s, name: RANKS[i][1], next: RANKS[i + 1] };
}
function renderHeader() {
  const r = rankInfo();
  $('#stats').innerHTML = `

}

  star: { w: 1, pts: Array.from({ length: 10 }, (_, k) => { const r = k % 2 ? 0.232 : 0.553, a = -Math.PI / 2 + k * Math.PI / 5; return [r * Math.cos(a), r * Math.sin(a) + 0.053]; }) },
  circle: { w: 1, circle: true },
  rabbit: { w: 0.6, pts: [[-0.3, 0.5], [-0.3, 0.02], [-0.22, -0.08], [-0.26, -0.5], [-0.1, -0.5], [-0.06, -0.12], [0.06, -0.12], [0.1, -0.5], [0.26, -0.5], [0.22, -0.08], [0.3, 0.02], [0.3, 0.5]] },
};
function shapePath(ctx, name, cx, cy, h) {
  const s = SHAPES[name];
  ctx.beginPath();
  if (s.circle) { ctx.arc(cx, cy, h / 2, 0, Math.PI * 2); return; }
  s.pts.forEach(([x, y], k) => k ? ctx.lineTo(cx + x * h, cy + y * h) : ctx.moveTo(cx + x * h, cy + y * h));
  ctx.closePath();
}
function shapeSvg(name, cx, cy, h) {
  const s = SHAPES[name];
  if (s.circle) return `<circle cx="${cx}" cy="${cy}" r="${h / 2}"/>`;
  return `<path d="M${s.pts.map(([x, y]) => `${(cx + x * h).toFixed(1)} ${(cy + y * h).toFixed(1)}`).join(' L')} Z"/>`;
}

let anim = null;
function stopAnim() { if (anim) { cancelAnimationFrame(anim); anim = null; } }
function loop(fn) { stopAnim(); const step = now => { if (fn(now) === false) { anim = null; return; } anim = requestAnimationFrame(step); }; anim = requestAnimationFrame(step); }
function focusFirst(sel) { const h = view.querySelector(sel); if (h) { h.tabIndex = -1; h.focus({ preventScroll: true }); } }
function go(name, boot) {
  stopAnim(); clearView();
  if (name === 'home') renderHome();
  else if (name === 'notes') renderNotes();
  else { const st = STATIONS.find(s => s.id === name); if (st) st.start(); }
  window.scrollTo(0, 0);
  if (!boot) focusFirst('h1, h2');
}

// Canvas helpers: crisp at any width, labels grow on narrow screens, redraw only when something changes.
function setupCanvas(cv, LW, LH) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = cv.clientWidth || LW;
  if (cv._w !== w) { cv._w = w; cv.width = Math.round(w * dpr); cv.height = Math.round(w * LH / LW * dpr); }
  const ctx = cv.getContext('2d');
  const k = cv.width / LW;
  ctx.setTransform(k, 0, 0, k, 0, 0);
  ctx.clearRect(0, 0, LW, LH);
  ctx._grow = Math.min(1.8, Math.max(1, LW / w * 0.8));
  return ctx;
}
const fs = (ctx, px) => Math.round(px * ctx._grow);
let teardown = [];
function clearView() { teardown.forEach(f => f()); teardown = []; }
function autoRedraw(cv, draw) {
  draw();
  const ro = new ResizeObserver(() => { if (cv.isConnected) draw(); });
  ro.observe(cv);
  const onTheme = () => { if (cv.isConnected) draw(); };
  darkMq.addEventListener('change', onTheme);
  teardown.push(() => { ro.disconnect(); darkMq.removeEventListener('change', onTheme); cv.width = cv.height = 0; });
}

/* ---------- Quiz runner ---------- */
// A question's render(box, done) calls done(ok, explainHtml, mark?, solved?).
// ok = counted as correct (first try). solved = the pupil got there in the end (shown as success, not counted).
function runQuiz(st, intro, questions) {
  let i = 0, right = 0;
  const n = questions.length;
  view.innerHTML = `${head(st, intro)}
    <div class="progress"><div class="bar"><i id="pbar"></i></div><span id="pcount" class="mono"></span></div>
    <div id="qbox" class="qbox"></div>
    <div id="fb" class="fb" hidden></div>`;
  const qbox = $('#qbox'), fb = $('#fb');
  function show() {
    stopAnim(); clearView();
    $('#pbar').style.width = (i / n * 100) + '%';
    $('#pcount').textContent = `${i + 1} / ${n}`;
    fb.hidden = true; qbox.innerHTML = '';
    questions[i].render(qbox, answered);
    if (i > 0) { const p = qbox.querySelector('.prompt'); if (p) { p.tabIndex = -1; p.focus({ preventScroll: true }); } }
  }
  function answered(ok, explain, mark, solved = ok) {
    if (ok) right++;
    sfx(solved ? 'good' : 'bad');
    $('#pbar').style.width = ((i + 1) / n * 100) + '%';
    fb.className = 'fb ' + (ok ? 'good' : solved ? 'info' : 'bad');
    const heading = mark || (ok ? 'Correct!' : 'Not quite');
    fb.innerHTML = `<div class="fb-mark">${heading}</div>
      <div class="fb-body">${explain}</div>
      <button class="btn" id="nextBtn" disabled>${i + 1 < n ? 'Next question →' : 'See results'}</button>`;
    fb.hidden = false;
    announce(heading + '. ' + explain);
    const nb = $('#nextBtn');
    nb.onclick = () => { i++; if (i < n) { show(); qbox.scrollIntoView({ block: 'nearest' }); } else finish(st, right, n); };
    setTimeout(() => { if (!nb.isConnected) return; nb.disabled = false; nb.focus({ preventScroll: true }); }, 450);
    fb.scrollIntoView({ block: 'nearest', behavior: reduced ? 'auto' : 'smooth' });
  }
  show();
}

function finish(st, right, n) {
  stopAnim(); clearView();
  const stars = starsFor(right, n);
  const prev = state.best[st.id] || 0;
  const xp = right * 10;
  state.xp += xp;
  state.best[st.id] = Math.max(prev, stars);
  save(); renderHeader();
  sfx(stars >= 2 ? 'win' : 'good');
  const miss = n - right;
  const msg = [
    'Keep going. Read the Science Notebook, then have another go.',
    'Good start. Read the feedback carefully and try again.',
    `Well done! You made ${miss} mistakes. Make no more than 1 to get 3 stars.`,
    'Brilliant! You have mastered this station.',
  ][stars];
  view.innerHTML = `${head(st, '', false)}
    <section class="results">
      ${starRow(stars)}
      <h2>${['Try again', 'Nice try', 'Great work', 'Excellent'][stars]}</h2>
      <p class="score">${right} / ${n} correct on the first try · +${xp} XP</p>
      ${stars > prev ? `<p class="score" style="color:var(--good); font-size:.95rem; margin-top:6px">New best for this station!</p>` : ''}
      <p class="msg">${msg}</p>
      <div class="row">
        <button class="btn" data-go="${st.id}">Play again</button>
        <button class="btn ghost" data-go="home">Back to lab map</button>
        ${stars < 3 ? '<button class="btn ghost" data-go="notes">Open notebook</button>' : ''}
      </div>
    </section>`;
  window.scrollTo(0, 0);
  focusFirst('.results h2');
  announce(`${stars} of 3 stars. ${right} of ${n} correct on the first try.`);
}

function sortBoard(root, bins, items, onDone) {
  let sel = null, placed = 0, firstTry = 0;
  const missed = new Set();
  root.innerHTML = `<p class="howto">Tap a card, then tap the box it belongs in.</p>
    <div class="bins" style="--cols:${bins.length}">${bins.map(b => `<button class="bin" data-s="${b.key}" style="--c:var(--${b.tone})" aria-labelledby="bn-${b.key} bh-${b.key}" aria-describedby="bin-${b.key}"><span class="bin-name" id="bn-${b.key}">${b.name}</span><span class="bin-hint" id="bh-${b.key}">${b.hint}</span><span class="bin-items" id="bin-${b.key}"></span></button>`).join('')}</div>
    <div class="tray">${items.map((it, k) => `<button class="chip" data-k="${k}" aria-pressed="false"><span aria-hidden="true">${it.icon}</span>${it.name}</button>`).join('')}</div>
    <div class="fb info sfb" id="sfb" aria-live="polite"><div class="fb-body"><b>${items.length} cards</b> to sort. Pick one to begin.</div></div>`;
  const fb = $('#sfb', root);
  const setSel = k => {
    sel = k;
    $$('.chip', root).forEach(c => { const on = +c.dataset.k === k; c.classList.toggle('sel', on); c.setAttribute('aria-pressed', on); });
    $$('.bin', root).forEach(b => b.classList.toggle('armed', k !== null));
  };
  $$('.chip', root).forEach(c => c.onclick = () => setSel(sel === +c.dataset.k ? null : +c.dataset.k));
  $$('.bin', root).forEach(b => b.onclick = () => {
    if (placed === items.length) return;
    if (sel === null) {
      if (!fb.querySelector('.pick-hint')) fb.insertAdjacentHTML('beforeend', '<div class="fb-body pick-hint">Pick a card first, then tap a box.</div>');
      return;
    }
    const it = items[sel], chip = $(`.chip[data-k="${sel}"]`, root), bin = bins.find(x => x.key === b.dataset.s);
    if (b.dataset.s === it.k) {
      placed++; if (!missed.has(sel)) firstTry++;
      sfx('good');
      $('#bin-' + it.k, root).insertAdjacentHTML('beforeend', `<span class="placed"><span aria-hidden="true">${it.icon}</span> ${it.name}</span>`);
      chip.remove(); setSel(null);
      fb.className = 'fb good sfb';
      fb.innerHTML = `<div class="fb-mark">Correct!</div><div class="fb-body">${it.why}</div>`;
      const next = $('.chip', root);
      if (next) next.focus({ preventScroll: true });
      if (placed === items.length) {
        fb.innerHTML += `<button class="btn" id="doneBtn">See results</button>`;
        $('#doneBtn', root).onclick = () => onDone(firstTry, items.length);
        $('#doneBtn', root).focus({ preventScroll: true });
        fb.scrollIntoView({ block: 'nearest', behavior: reduced ? 'auto' : 'smooth' });
      }
    } else {
      missed.add(sel); sfx('bad');
      chip.classList.remove('shake'); void chip.offsetWidth; chip.classList.add('shake');
      fb.className = 'fb bad sfb';
      fb.innerHTML = `<div class="fb-mark">Not ${bin.wrong}</div><div class="fb-body">Think again about this one: <b>${it.name}</b>. ${bin.ask}</div>`;
    }
  });
}

/* ---------- Station 3: Shadow Theatre ---------- */
const MAT = {
  opaque: { label: 'Cardboard (opaque)', side: 0.92, panel: 0.9 },
  translucent: { label: 'Tracing paper (translucent)', side: 0.45, panel: 0.36 },
  transparent: { label: 'Clear plastic (transparent)', side: 0.08, panel: 0.07 },
};
const TH = { TX: 50, TY: 170, SX: 440, h0: 50, PX: 470, PW: 240 };
const shadowH = d => TH.h0 * (TH.SX - TH.TX) / (d - TH.TX);
const distFor = H => TH.TX + TH.h0 * (TH.SX - TH.TX) / H;

function labelText(ctx, text, x, y, fill, halo) {
  ctx.lineWidth = 4; ctx.strokeStyle = halo; ctx.lineJoin = 'round'; ctx.strokeText(text, x, y);
  ctx.fillStyle = fill; ctx.fillText(text, x, y);
}
function drawTheatre(ctx, s) {
  const { TX, TY, SX, h0, PX, PW } = TH;
  const room = cssVar('--room'), sun = cssVar('--sun'), beam = cssVar('--beam'), screen = cssVar('--screen');
  const H = shadowH(s.d), mat = MAT[s.mat];
  ctx.fillStyle = room; ctx.fillRect(0, 0, 720, 340);
  // beam of light
  ctx.save(); ctx.globalAlpha = 0.5; ctx.fillStyle = beam;
  ctx.beginPath(); ctx.moveTo(TX, TY); ctx.lineTo(SX, 18); ctx.lineTo(SX, 322); ctx.closePath(); ctx.fill(); ctx.restore();
  // shadow region behind the puppet
  ctx.save(); ctx.globalAlpha = mat.side; ctx.fillStyle = room;
  ctx.beginPath(); ctx.moveTo(s.d, TY - h0 / 2); ctx.lineTo(SX, TY - H / 2); ctx.lineTo(SX, TY + H / 2); ctx.lineTo(s.d, TY + h0 / 2); ctx.closePath(); ctx.fill(); ctx.restore();
  // straight-line rays past the puppet's edges
  ctx.save(); ctx.strokeStyle = sun; ctx.lineWidth = 1.5; ctx.setLineDash([5, 5]);
  [-1, 1].forEach(sg => { ctx.beginPath(); ctx.moveTo(TX, TY); ctx.lineTo(SX, TY + sg * H / 2); ctx.stroke(); });
  ctx.restore();

const SUN = { GY: 250, PX: 360, PH: 92 }; // pole is 2 m tall
const fmtTime = t => { const h = Math.floor(t), m = Math.round((t - h) * 60); const hh = ((h + 11) % 12) + 1; return `${hh}:${String(m).padStart(2, '0')} ${h < 12 ? 'am' : 'pm'}`; };
function sunGeom(t) {
  const th = Math.PI * (t - 6) / 12; // 6 am: east horizon (right); 12 noon: overhead; 6 pm: west horizon (left)
  const elev = Math.min(th, Math.PI - th);
  const overhead = Math.abs(Math.cos(th)) < 1e-6;
  const L = overhead ? 0 : Math.min(330, SUN.PH / Math.tan(Math.max(elev, 0.05)));
  const dir = Math.cos(th) > 0 ? -1 : 1; // Sun in the east (right) → shadow to the west (left)
  return { th, L, dir, sx: SUN.PX + 300 * Math.cos(th), sy: SUN.GY - 210 * Math.sin(th) };
}
function describeSun(t) {
  const g = sunGeom(t);
  if (g.L < 8) return 'Shadow: very short, almost under the pole.';
  if (g.L >= 330) return `Shadow: very long (more than 7 m), pointing ${g.dir < 0 ? 'west' : 'east'}.`;
  return `Shadow: about ${(g.L * 2 / SUN.PH).toFixed(1)} m long, pointing ${g.dir < 0 ? 'west' : 'east'}.`;
}
function drawSun(ctx, t) {
  const { GY, PX, PH } = SUN, g = sunGeom(t);
  ctx.fillStyle = cssVar('--sky'); ctx.fillRect(0, 0, 720, 320);
  ctx.save(); ctx.setLineDash([4, 6]); ctx.strokeStyle = cssVar('--muted'); ctx.globalAlpha = 0.5; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.ellipse(PX, GY, 300, 210, 0, Math.PI, 2 * Math.PI); ctx.stroke(); ctx.restore();
  ctx.fillStyle = cssVar('--ground'); ctx.fillRect(0, GY, 720, 70);
  // shadow on the ground
  ctx.save(); ctx.fillStyle = cssVar('--cast'); ctx.globalAlpha = 0.7;
  ctx.beginPath(); ctx.ellipse(PX + g.dir * g.L / 2, GY + 6, Math.max(6, g.L / 2), 7, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  // pole + flag
  ctx.fillStyle = cssVar('--ink'); ctx.fillRect(PX - 4, GY - PH, 8, PH);
  ctx.fillStyle = cssVar('--hot'); ctx.beginPath(); ctx.moveTo(PX + 4, GY - PH); ctx.lineTo(PX + 38, GY - PH + 12); ctx.lineTo(PX + 4, GY - PH + 24); ctx.closePath(); ctx.fill();
  // Sun
  ctx.fillStyle = cssVar('--sun');
  ctx.beginPath(); ctx.arc(g.sx, g.sy, 22, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = cssVar('--sun'); ctx.lineWidth = 3;
  for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4; ctx.beginPath(); ctx.moveTo(g.sx + Math.cos(a) * 28, g.sy + Math.sin(a) * 28); ctx.lineTo(g.sx + Math.cos(a) * 36, g.sy + Math.sin(a) * 36); ctx.stroke(); }
  const f = fs(ctx, 15);
  ctx.fillStyle = cssVar('--ink'); ctx.font = `700 ${f}px Lexend, system-ui, sans-serif`;
  ctx.textAlign = 'left'; ctx.fillText('WEST', 12, 314);
  ctx.textAlign = 'right'; ctx.fillText('EAST', 708, 314);
  ctx.textAlign = 'left'; ctx.font = `500 ${fs(ctx, 17)}px "DM Mono", monospace`; ctx.fillText(fmtTime(t), 12, 10 + fs(ctx, 17));
}

/* ---------- Station 5: Heat Flow Lab ---------- */
function thermometer(temp) {
  const y = v => 270 - v * 2.4;
  let ticks = '';
  for (let v = 0; v <= 100; v += 2) {
    const major = v % 10 === 0;
    ticks += `<line x1="66" x2="${major ? 82 : 74}" y1="${y(v)}" y2="${y(v)}" class="tick${major ? ' major' : ''}"/>`;
    if (major) ticks += `<text x="46" y="${y(v) + 3.5}" class="tlab">${v}</text>`;
  }
  return `<svg class="thermo" viewBox="0 0 120 330" role="img" aria-label="Thermometer marked from 0 to 100 °C">
    <rect x="52" y="${y(temp)}" width="14" height="${300 - y(temp)}" class="d-hot"/>
    <circle cx="59" cy="300" r="16" class="d-hot"/>
    ${ticks}
    <path d="M52 288 V20 A7 7 0 0 1 66 20 V288" class="d-line"/>
    <circle cx="59" cy="300" r="17" class="d-line"/>
    <text x="96" y="22" class="d-lab">°C</text>
  </svg>`;
}
function thermoQ() {
  let t; do { t = randEven(14, 94); } while (t % 10 === 0);
  return numeric({
    figure: thermometer(t), unit: '°C', answer: t,
    prompt: 'What temperature does this thermometer show?',
    tip: 'Each small mark stands for 2 °C. Read the mark level with the top of the red liquid.',
    explain: `Find the labelled mark just below the top of the liquid, then count up in 2s: <b>${t} °C</b>.`,
  });
}
function flowQ(sc) {
  return {
    render(box, done) {
      const tf = sc.room ? sc.tb : sc.ta === sc.tb ? sc.ta : Math.round((sc.ca * sc.ta + sc.cb * sc.tb) / (sc.ca + sc.cb));
      const key = sc.ta > sc.tb ? 'AB' : sc.ta < sc.tb ? 'BA' : 'none';
      const roleA = key === 'AB' ? 'hot' : key === 'BA' ? 'cold' : 'muted', roleB = key === 'AB' ? 'cold' : key === 'BA' ? 'hot' : 'muted';
      const card = (id, n, ic, t) => `<div class="obj"><span class="obj-icon" aria-hidden="true">${ic}</span><span class="obj-name">${id} · ${n}</span><div class="mini" aria-hidden="true"><i id="bar${id}"></i></div><span class="mono obj-t" id="t${id}">${t} °C</span></div>`;
      box.innerHTML = `<p class="prompt">${sc.q} Which way does heat flow?</p>
        <div class="flow">${card('A', sc.a, sc.ia, sc.ta)}<div class="flow-mid"><svg id="arw" viewBox="0 0 80 40" hidden aria-hidden="true"><path d="M5 20 H70 M56 7 L72 20 L56 33" class="arrow-path"/></svg></div>${card('B', sc.b, sc.ib, sc.tb)}</div>
        <div class="opts">
          <button class="opt" data-k="AB"><span class="opt-key">1</span><span>Heat flows from A to B</span></button>
          <button class="opt" data-k="BA"><span class="opt-key">2</span><span>Heat flows from B to A</span></button>
          <button class="opt" data-k="none"><span class="opt-key">3</span><span>No heat flows between them</span></button>
        </div>`;
      const paint = (id, T, role) => {
        $('#t' + id, box).textContent = Math.round(T) + ' °C';
        const bar = $('#bar' + id, box); bar.style.height = Math.max(4, T) + '%'; bar.style.background = `var(--${role})`;
      };
      paint('A', sc.ta, roleA); paint('B', sc.tb, roleB);
      $$('.opt', box).forEach(b => b.onclick = () => {
        const ok = b.dataset.k === key;
        markOpts(box, key, b);
        if (key !== 'none') {
          const arw = $('#arw', box); arw.removeAttribute('hidden'); arw.classList.toggle('rev', key === 'BA');
          const t0 = performance.now();
          loop(now => {
            if (!box.isConnected) return false;
            const p = reduced ? 1 : Math.min(1, (now - t0) / 2600), e = ease3(p);
            paint('A', sc.ta + (tf - sc.ta) * e, roleA); paint('B', sc.tb + (tf - sc.tb) * e, roleB);
            if (p >= 1) return false;
          });
        }
        const [hot, hT, cold, cT] = sc.ta > sc.tb ? [sc.a, sc.ta, sc.b, sc.tb] : [sc.b, sc.tb, sc.a, sc.ta];
        let ex;
        if (key === 'none') ex = `Both are at the same temperature (${sc.ta} °C), so there is no heat flow between them.`;
        else if (sc.room) {
          const obj = sc.a.toLowerCase();
          ex = `Heat flows from the ${hot.toLowerCase()} (${hT} °C) to the ${cold.toLowerCase()} (${cT} °C), because heat flows from hotter to colder. The ${obj} ${key === 'AB' ? 'loses heat and its temperature falls' : 'gains heat and its temperature rises'} until it reaches room temperature (${sc.tb} °C). There is so much air in the room that its temperature hardly changes.`;
        } else {
          ex = `Heat flows from the ${hot.toLowerCase()} (${hT} °C) to the ${cold.toLowerCase()} (${cT} °C), because heat flows from hotter to colder. The ${hot.toLowerCase()} loses heat and its temperature falls. The ${cold.toLowerCase()} gains heat and its temperature rises. Heat stops flowing between them when both reach the same temperature (about ${tf} °C).`;
        }
        done(ok, ex);
      });
    }
  };
}

      <section class="note">

        <div class="wrap-x"><table class="ntable">

          <tbody>
            <tr><th scope="row" style="--c:var(--transparent)">Transparent</th><td>Most light</td><td>Clear glass, clear plastic, cling wrap</td></tr>

        <p class="def">A shadow forms when light is <b>completely or partly blocked</b> by an object.</p>
        <ul>
          <li>Opaque objects block all light and cast dark shadows. Translucent objects block only part of the light, so their shadows are lighter. Transparent objects cast very faint shadows or none.</li>
          <li>Moving the object <b>closer to the light</b> makes the shadow <b>bigger</b>. Moving it away makes the shadow smaller.</li>
          <li>Moving the <b>light closer</b> to the object, or the <b>screen further away</b> from it, also makes the shadow <b>bigger</b>.</li>
          <li>The shadow's shape depends on the object's shape and which side faces the light.</li>
          <li>A shadow forms on the side <b>away from the light</b>. The shadow of an <b>opaque</b> object is dark, whatever colour the object is.</li>
